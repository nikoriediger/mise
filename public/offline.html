<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eef6ea" />
    <title>Offline</title>
    <style>
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #1f3524; text-align: center;
        background: radial-gradient(60rem 40rem at 0% 0%, #c4e8d0, transparent 60%), radial-gradient(55rem 40rem at 100% 15%, #c8e0a6, transparent 60%), #eef6ea;
      }
      main { padding: 2rem; max-width: 22rem; }
      .icon { width: 4rem; height: 4rem; margin: 0 auto 1rem; border-radius: 1rem; display: flex; align-items: center; justify-content: center; font-size: 2rem; background: #4a7c4e; }
      h1 { font-family: Georgia, serif; font-size: 1.6rem; margin: 0 0 .5rem; }
      p { color: #5b7158; margin: .35rem 0; line-height: 1.5; }
      button { margin-top: 1.25rem; min-height: 3rem; padding: 0 1.5rem; border: 0; border-radius: .75rem; background: #4a7c4e; color: #fbfdf8; font-size: 1rem; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon">🌿</div>
      <h1>Offline</h1>
      <p>Keine Internetverbindung. Bereits angesehene Rezepte kannst du trotzdem öffnen.</p>
      <p>No internet connection. Recipes you've viewed before still work.</p>
      <p>Nessuna connessione. Le ricette già viste restano disponibili.</p>
      <button onclick="location.reload()">↻</button>
    </main>
  </body>
</html>
